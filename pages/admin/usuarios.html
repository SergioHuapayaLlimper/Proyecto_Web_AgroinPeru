<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - AgroinPeru Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/CSS/admin.css">
    <style>
        /* ── Modal overlay ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1050;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: 12px;
            padding: 1.75rem;
            width: min(460px, 94vw);
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        }
        .modal-box h5 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-box label {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 4px;
            display: block;
        }
        .modal-box input,
        .modal-box select {
            width: 100%;
            padding: .5rem .75rem;
            font-size: 13px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
            background: #f8f9fa;
            color: #212529;
        }
        .modal-box input:focus,
        .modal-box select:focus {
            border-color: #198754;
            box-shadow: 0 0 0 3px rgba(25, 135, 84, .15);
            background: #fff;
        }
        .modal-footer-custom {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #dee2e6;
        }
        /* ── Toast ── */
        .toast-custom {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: .75rem 1.25rem;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 2000;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .toast-custom.show { display: flex; }
        .toast-custom.success { background: #198754; }
        .toast-custom.danger  { background: #dc3545; }
        /* ── Confirm box ── */
        .confirm-center { text-align: center; padding: .5rem; }
        .confirm-center .icon-danger {
            font-size: 2.5rem;
            color: #dc3545;
            margin-bottom: .75rem;
        }
        .confirm-center p {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 1.25rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="admin-wrapper">
    <!-- ════════════════════ SIDEBAR ════════════════════ -->
    <aside class="admin-sidebar">
        <div class="sidebar-brand d-flex align-items-center gap-2">
            <i class="fa-solid fa-leaf text-success fs-4"></i>
            <div>
                <h1 class="h6 m-0 text-white fw-bold">AgroinPeru</h1>
                <small class="opacity-50 font-monospace" style="font-size:11px;">Panel Admin</small>
            </div>
        </div>
        <ul class="sidebar-menu">
            <li><a href="/pages/admin/dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="/pages/admin/inventario.html"><i class="fa-solid fa-boxes-stacked"></i> Inventario</a></li>
            <li><a href="/pages/admin/reportes.html"><i class="fa-solid fa-file-invoice-dollar"></i> Reportes</a></li>
            <li><a href="/pages/admin/usuarios.html" class="active"><i class="fa-solid fa-users"></i> Usuarios</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/index.html"><i class="fa-solid fa-right-from-bracket"></i> Salir</a>
        </div>
    </aside>

    <!-- ════════════════════ MAIN ════════════════════ -->
    <main class="admin-content">
        <!-- Header -->
        <header class="admin-header d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <button class="btn d-lg-none p-0 text-dark" id="sidebarToggle">
                    <i class="fa-solid fa-bars fs-4"></i>
                </button>
                <h2 class="h5 m-0 fw-bold">Usuarios</h2>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="text-end d-none d-sm-block">
                    <span class="d-block small fw-bold text-dark">Carlos Mendoza Ríos</span>
                    <small class="text-muted" style="font-size:11px;">Administrador</small>
                </div>
                <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center"
                     style="width:40px;height:40px;">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </header>

        <!-- Botón Nuevo Usuario (RF32) -->
        <div class="text-end mb-4">
            <button class="btn btn-success rounded-3 px-4 py-2 fw-semibold shadow-sm"
                    onclick="abrirModalNuevo()">
                <i class="fa-solid fa-user-plus me-2"></i>Nuevo Usuario
            </button>
        </div>

        <!-- Listado de usuarios (RF31) -->
        <div class="row g-4" id="userCards"></div>
    </main>
</div>

<!-- ══════════════════════════════════════════════════
     MODAL: Registrar nuevo usuario (RF32)
══════════════════════════════════════════════════ -->
<div class="modal-overlay" id="overlayNuevo">
    <div class="modal-box">
        <h5><i class="fa-solid fa-user-plus text-success"></i> Registrar nuevo usuario</h5>

        <div class="row g-3">
            <div class="col-6">
                <label>Nombre</label>
                <input type="text" id="nNombre" placeholder="Nombre" />
            </div>
            <div class="col-6">
                <label>Apellidos</label>
                <input type="text" id="nApellido" placeholder="Apellidos" />
            </div>
            <div class="col-12">
                <label>Correo electrónico</label>
                <input type="email" id="nCorreo" placeholder="correo@agroinperu.com" />
            </div>
            <div class="col-12">
                <label>Contraseña</label>
                <input type="password" id="nPass" placeholder="••••••••" />
            </div>
            <div class="col-6">
                <label>Rol</label>
                <select id="nRol">
                    <option value="cajero">cajero</option>
                    <option value="admin">admin</option>
                </select>
            </div>
            <div class="col-6">
                <label>Estado</label>
                <select id="nEstado">
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>
        </div>

        <div class="modal-footer-custom">
            <button class="btn btn-outline-secondary btn-sm rounded-3"
                    onclick="cerrarModal('overlayNuevo')">Cancelar</button>
            <button class="btn btn-success btn-sm rounded-3 fw-semibold"
                    onclick="guardarNuevo()">
                <i class="fa-solid fa-check me-1"></i>Registrar
            </button>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════════
     MODAL: Editar usuario (RF33)
══════════════════════════════════════════════════ -->
<div class="modal-overlay" id="overlayEditar">
    <div class="modal-box">
        <h5><i class="fa-solid fa-pen text-primary"></i> Editar usuario</h5>
        <input type="hidden" id="eId" />

        <div class="row g-3">
            <div class="col-6">
                <label>Nombre</label>
                <input type="text" id="eNombre" />
            </div>
            <div class="col-6">
                <label>Apellidos</label>
                <input type="text" id="eApellido" />
            </div>
            <div class="col-12">
                <label>Correo electrónico</label>
                <input type="email" id="eCorreo" />
            </div>
            <div class="col-6">
                <label>Rol</label>
                <select id="eRol">
                    <option value="cajero">cajero</option>
                    <option value="admin">admin</option>
                </select>
            </div>
            <div class="col-6">
                <label>Estado</label>
                <select id="eEstado">
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>
        </div>

        <div class="modal-footer-custom">
            <button class="btn btn-outline-secondary btn-sm rounded-3"
                    onclick="cerrarModal('overlayEditar')">Cancelar</button>
            <button class="btn btn-primary btn-sm rounded-3 fw-semibold"
                    onclick="guardarEdicion()">
                <i class="fa-solid fa-floppy-disk me-1"></i>Guardar cambios
            </button>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════════
     MODAL: Confirmar eliminación (RF34)
══════════════════════════════════════════════════ -->
<div class="modal-overlay" id="overlayEliminar">
    <div class="modal-box" style="max-width:380px;">
        <div class="confirm-center">
            <div class="icon-danger"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <p>¿Estás seguro de que deseas eliminar a<br><strong id="delNombre"></strong>?<br>
            Esta acción no se puede deshacer.</p>
            <div class="d-flex gap-2 justify-content-center">
                <button class="btn btn-outline-secondary btn-sm rounded-3"
                        onclick="cerrarModal('overlayEliminar')">Cancelar</button>
                <button class="btn btn-danger btn-sm rounded-3 fw-semibold"
                        onclick="confirmarEliminar()">
                    <i class="fa-solid fa-trash me-1"></i>Eliminar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Toast de notificación -->
<div class="toast-custom" id="toast">
    <i class="fa-solid fa-check-circle"></i>
    <span id="toastMsg"></span>
</div>

<!-- ════════════════════ SCRIPTS ════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ─────────────────────────────────────────
   Estado de usuarios en memoria
   En producción: reemplazar con fetch() a tu API
───────────────────────────────────────── */
let usuarios = [
    {
        id: 1,
        nombre: 'Carlos',
        apellido: 'Mendoza Ríos',
        correo: 'admin@agroinperu.com',
        rol: 'admin',
        estado: 'activo',
        desde: '2023-01-15'
    },
    {
        id: 2,
        nombre: 'María',
        apellido: 'Torres Vega',
        correo: 'cajero@agroinperu.com',
        rol: 'cajero',
        estado: 'activo',
        desde: '2023-03-10'
    },
    {
        id: 3,
        nombre: 'Ana',
        apellido: 'Ccallo Mamani',
        correo: 'ana.ccallo@agroinperu.com',
        rol: 'admin',
        estado: 'inactivo',
        desde: '2022-11-08'
    }
];
let nextId = 4;
let idAEliminar = null;

/* ─────────────────────────────────────────
   RF31 – Renderizar listado de usuarios
───────────────────────────────────────── */
function renderizarUsuarios() {
    const contenedor = document.getElementById('userCards');
    contenedor.innerHTML = '';

    usuarios.forEach(u => {
        const esAdmin = u.rol === 'admin';
        const iconoRol    = esAdmin ? 'fa-shield-halved' : 'fa-user';
        const colorIcon   = esAdmin ? 'success' : 'primary';
        const badgeRol    = esAdmin
            ? '<span class="badge bg-success bg-opacity-10 text-success rounded-pill px-2 py-1 fw-semibold font-monospace" style="font-size:10px;">admin</span>'
            : '<span class="badge bg-primary bg-opacity-10 text-primary rounded-pill px-2 py-1 fw-semibold font-monospace" style="font-size:10px;">cajero</span>';
        const badgeEstado = u.estado === 'activo'
            ? '<span class="badge bg-success bg-opacity-10 text-success rounded-pill px-2 py-1">Activo</span>'
            : '<span class="badge bg-secondary bg-opacity-10 text-secondary rounded-pill px-2 py-1">Inactivo</span>';

        contenedor.innerHTML += `
        <div class="col-12 col-md-6 col-xl-4" id="card-${u.id}">
            <div class="card stat-card p-4 bg-white">
                <div class="d-flex align-items-start gap-3">
                    <div class="bg-${colorIcon} bg-opacity-10 text-${colorIcon} rounded-circle
                                d-flex align-items-center justify-content-center shadow-sm"
                         style="width:48px;height:48px;flex-shrink:0;">
                        <i class="fa-solid ${iconoRol} fs-5"></i>
                    </div>
                    <div class="flex-grow-1">
                        <h4 class="h6 fw-bold m-0 text-dark">${u.nombre} ${u.apellido}</h4>
                        ${badgeRol}
                        <div class="text-muted small d-flex flex-column gap-1 mt-1">
                            <span><i class="fa-regular fa-envelope me-2"></i>${u.correo}</span>
                            <span><i class="fa-regular fa-calendar-days me-2"></i>Desde: ${u.desde}</span>
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                    ${badgeEstado}
                    <div>
                        <button class="btn btn-link text-primary p-1 me-2"
                                title="Editar usuario"
                                onclick="abrirModalEditar(${u.id})">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn btn-link text-danger p-1"
                                title="Eliminar usuario"
                                onclick="abrirModalEliminar(${u.id})">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>`;
    });
}

/* ─────────────────────────────────────────
   Helpers: abrir / cerrar modales
───────────────────────────────────────── */
function abrirModal(id)  { document.getElementById(id).classList.add('open'); }
function cerrarModal(id) { document.getElementById(id).classList.remove('open'); }

/* Cerrar al hacer clic fuera del modal-box */
document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => {
        if (e.target === overlay) overlay.classList.remove('open');
    });
});

/* ─────────────────────────────────────────
   Toast
───────────────────────────────────────── */
function mostrarToast(mensaje, tipo = 'success') {
    const toast = document.getElementById('toast');
    const icono = tipo === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation';
    toast.querySelector('i').className = `fa-solid ${icono}`;
    document.getElementById('toastMsg').textContent = mensaje;
    toast.className = `toast-custom show ${tipo}`;
    setTimeout(() => { toast.className = 'toast-custom'; }, 3000);
}

/* ─────────────────────────────────────────
   RF32 – Registrar nuevo usuario
───────────────────────────────────────── */
function abrirModalNuevo() {
    // Limpiar formulario
    ['nNombre', 'nApellido', 'nCorreo', 'nPass'].forEach(id => {
        document.getElementById(id).value = '';
    });
    document.getElementById('nRol').value    = 'cajero';
    document.getElementById('nEstado').value = 'activo';
    abrirModal('overlayNuevo');
}

function guardarNuevo() {
    const nombre   = document.getElementById('nNombre').value.trim();
    const apellido = document.getElementById('nApellido').value.trim();
    const correo   = document.getElementById('nCorreo').value.trim();
    const pass     = document.getElementById('nPass').value;

    // Validación básica
    if (!nombre || !apellido || !correo || !pass) {
        mostrarToast('Completa todos los campos obligatorios.', 'danger');
        return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
        mostrarToast('El correo no tiene un formato válido.', 'danger');
        return;
    }

    const hoy = new Date().toISOString().split('T')[0];
    usuarios.push({
        id:      nextId++,
        nombre,
        apellido,
        correo,
        rol:     document.getElementById('nRol').value,
        estado:  document.getElementById('nEstado').value,
        desde:   hoy
    });

    cerrarModal('overlayNuevo');
    renderizarUsuarios();
    mostrarToast('Usuario registrado correctamente.');
}

/* ─────────────────────────────────────────
   RF33 – Editar / modificar usuario
───────────────────────────────────────── */
function abrirModalEditar(id) {
    const u = usuarios.find(x => x.id === id);
    document.getElementById('eId').value      = id;
    document.getElementById('eNombre').value  = u.nombre;
    document.getElementById('eApellido').value = u.apellido;
    document.getElementById('eCorreo').value  = u.correo;
    document.getElementById('eRol').value     = u.rol;
    document.getElementById('eEstado').value  = u.estado;
    abrirModal('overlayEditar');
}

function guardarEdicion() {
    const id       = parseInt(document.getElementById('eId').value);
    const nombre   = document.getElementById('eNombre').value.trim();
    const apellido = document.getElementById('eApellido').value.trim();
    const correo   = document.getElementById('eCorreo').value.trim();

    if (!nombre || !apellido || !correo) {
        mostrarToast('Completa todos los campos obligatorios.', 'danger');
        return;
    }

    const u  = usuarios.find(x => x.id === id);
    u.nombre   = nombre;
    u.apellido = apellido;
    u.correo   = correo;
    u.rol      = document.getElementById('eRol').value;
    u.estado   = document.getElementById('eEstado').value;

    cerrarModal('overlayEditar');
    renderizarUsuarios();
    mostrarToast('Usuario actualizado correctamente.');
}

/* ─────────────────────────────────────────
   RF34 – Eliminar usuario con confirmación
───────────────────────────────────────── */
function abrirModalEliminar(id) {
    idAEliminar = id;
    const u = usuarios.find(x => x.id === id);
    document.getElementById('delNombre').textContent = `${u.nombre} ${u.apellido}`;
    abrirModal('overlayEliminar');
}

function confirmarEliminar() {
    usuarios = usuarios.filter(x => x.id !== idAEliminar);
    idAEliminar = null;
    cerrarModal('overlayEliminar');
    renderizarUsuarios();
    mostrarToast('Usuario eliminado.', 'danger');
}

/* ─────────────────────────────────────────
   Inicializar
───────────────────────────────────────── */
renderizarUsuarios();
</script>

</body>
</html>
