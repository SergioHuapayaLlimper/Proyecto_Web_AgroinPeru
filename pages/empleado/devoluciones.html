                </div>
            </div>
            <div class="sidebar-user text-white d-flex align-items-center gap-2">
                <div class="bg-success rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                    <i class="fa-solid fa-user fs-6"></i>
                </div>
                <div>
                    <div class="small fw-bold lh-1">María Torres Vega</div>
                    <small class="opacity-50" style="font-size: 10px;">Cajero</small>

            <ul class="sidebar-menu">

                        <input type="date" class="form-control">
                    </div>
                    <div class="col-12 mt-4">
